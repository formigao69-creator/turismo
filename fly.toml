# Fly.io — App ÚNICO (raiz do monorepo)
# Backend Express serve a API (/api) e o frontend estático no mesmo serviço.
# Deploy:  fly deploy        (a partir da raiz do repositório)
#
# Antes do primeiro deploy, configure os segredos:
#   fly postgres create --name turismo-db --region gru
#   fly postgres attach turismo-db          # injeta DATABASE_URL
#   fly secrets set JWT_SECRET="$(openssl rand -hex 32)"
#   fly secrets set EMAIL_SEMSET="semset@guarapari.es.gov.br"
#   # (opcional) SMTP_HOST, SMTP_USER, SMTP_PASS, GOOGLE_* ...

app = "turismo"
primary_region = "gru"  # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  # Mesmo origin: o frontend chama /api no próprio host
  FRONTEND_URL = "https://turismo.fly.dev"

# Aplica as migrations do banco a cada deploy, antes de subir a nova versão
[deploy]
  release_command = "npm run migrate"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
