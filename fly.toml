app = "turismo"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  FRONTEND_URL = "https://turismo.fly.dev"

# release_command = "echo ok" (no-op): sobrescreve explicitamente qualquer
# release_command anterior armazenado no backend do Fly. Sem esta linha, o Fly
# preserva o valor antigo mesmo quando a secao [deploy] e omitida do fly.toml.
# As migrations rodam no startup do app (src/index.js) com logs visiveis.
[deploy]
  release_command = "echo ok"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    # grace_period folgado: o app só passa a escutar após aplicar as migrations
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
