app = "turismo"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  FRONTEND_URL = "https://turismo.fly.dev"

# As migrations rodam no startup do app (backend/src/index.js), com logs no
# stream normal do app. Não usamos release_command porque a máquina de release
# do Fly costuma ser destruída antes de enviar os logs ("timeout waiting for
# release command logs"), escondendo qualquer erro real.

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    # grace_period folgado: o app só passa a escutar após aplicar as migrations
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
