app = "sisvetur-web"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  BACKEND_UPSTREAM = "https://sisvetur-api.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
