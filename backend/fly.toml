# Fly.io — Backend (API) do SisVetur Guarapari
# Implante a partir deste diretório:  fly deploy
# Ou da raiz do repositório:           fly deploy --config backend/fly.toml --dockerfile backend/Dockerfile

app = "sisvetur-api"
primary_region = "gru"  # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

# Executa as migrations a cada deploy, antes de subir a nova versão
[deploy]
  release_command = "npm run migrate"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
